<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Pro AI</title>
<style>
:root{--bg:#0d0d0f;--card:#16161c;--accent:#8b5cf6;--text:#e5e5e5}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
.sidebar{width:300px;background:var(--card);padding:20px;border-left:1px solid #2a2a35;transition:0.3s;position:absolute;right:0;height:100%;z-index:10}
.sidebar.hidden{transform:translateX(100%)}
.chat{flex:1;display:flex;flex-direction:column;width:100%}
.header{padding:15px 20px;border-bottom:1px solid #2a2a35;display:flex;align-items:center;gap:15px;background:var(--card)}
.menu-btn{font-size:24px;background:none;border:0;color:var(--text);cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:18px}
.msg{padding:16px 20px;border-radius:15px;max-width:85%;line-height:1.8;white-space:pre-wrap;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:5px}
.ai{background:#222230;align-self:flex-start;border-bottom-left-radius:5px}
.input{display:flex;padding:20px;gap:10px;background:var(--card);border-top:1px solid #2a2a35}
#prompt{flex:1;padding:14px;background:#0d0d0f;border:1px solid #333;border-radius:12px;color:#fff;resize:none;font-size:15px}
button{padding:12px 18px;background:var(--accent);border:0;border-radius:12px;color:#fff;font-weight:bold;cursor:pointer;transition:0.2s}
button:hover{opacity:0.8}
input,select{width:100%;padding:11px;margin:6px 0;background:#0d0d0f;border:1px solid #333;border-radius:10px;color:#fff}
label{font-size:13px;color:#999}
.chat-item{padding:12px;background:#222230;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px}
.chat-item:hover{background:#2a2a35}
.info{font-size:12px;color:#777;margin-top:5px}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <h3>⚙️ الاعدادات</h3>
  <label>رابط Ollama</label>
  <input id="ollama_url" value="http://127.0.0.1:11434">
  <button onclick="loadModels()">تحديث الموديلات</button>
  <p id="status" style="font-size:12px;color:#4ade80"></p>
  <label>الموديل</label>
  <select id="model"></select>
  <label>Temperature: <span id="t_val">0.7</span></label>
  <input id="temp" type="range" min="0" max="1.5" step="0.1" value="0.7" oninput="t_val.innerText=this.value">
  <hr style="border-color:#333;margin:15px 0">
  <h3>💬 المحادثات</h3>
  <button onclick="newChat()" style="width:100%;margin-bottom:10px">+ محادثة جديدة</button>
  <div id="chat_list"></div>
</div>

<div class="chat">
  <div class="header">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <h2 style="margin:0">Ollama Pro</h2>
    <button onclick="clearChat()" style="margin-right:auto;background:#333">مسح</button>
  </div>
  <div id="messages"></div>
  <div class="input">
    <textarea id="prompt" rows="2" placeholder="اسأل tinydolphin..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button onclick="send()">ارسال</button>
  </div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem('ollama_chats')||'{}');
let currentChat = Object.keys(chats)[0] || 'chat_'+Date.now();
if(!chats[currentChat]) chats[currentChat]=[];

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('hidden');
}

async function loadModels(){
  status.innerText = 'جاري الاتصال...';
  try{
    const res = await fetch(ollama_url.value + '/api/tags');
    const data = await res.json();
    model.innerHTML = data.models.map(m => `<option>${m.name}</option>`).join('');
    status.innerText = 'متصل ✅';
  }catch(e){ status.innerText = 'خطأ في الاتصال'; }
}

async function send(){
  const prompt = document.getElementById('prompt').value.trim();
  if(!prompt) return;

  addMessage(prompt, 'user');
  chats[currentChat].push({role:'user', content:prompt});
  document.getElementById('prompt').value = '';

  const aiDiv = addMessage('', 'ai');
  const start = Date.now();

  try{
    const res = await fetch(ollama_url.value + '/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: model.value, prompt: prompt, stream: true,
        options: { temperature: parseFloat(temp.value) }
      })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';

    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      const chunk = decoder.decode(value);
      chunk.split('\n').filter(l=>l).forEach(line=>{
        const data = JSON.parse(line);
        fullText += data.response;
        aiDiv.innerText = fullText;
        messages.scrollTop = messages.scrollHeight;
      });
    }
    const time = ((Date.now()-start)/1000).toFixed(1);
    aiDiv.innerHTML += `<div class="info">⏱️ ${time} ثانية</div>`;
    chats[currentChat].push({role:'assistant', content:fullText});
    saveChats();
  }catch(e){ aiDiv.innerText = 'خطأ: ' + e.message; }
}

function addMessage(text, role){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerText = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}
function saveChats(){ localStorage.setItem('ollama_chats', JSON.stringify(chats)); loadChatList(); }
function newChat(){ currentChat='chat_'+Date.now(); chats[currentChat]=[]; saveChats(); messages.innerHTML=''; }
function clearChat(){ chats[currentChat]=[]; saveChats(); messages.innerHTML=''; }
function loadChatList(){
  chat_list.innerHTML = Object.keys(chats).slice(-10).reverse().map(id=>
    `<div class="chat-item" onclick="loadChat('${id}')">محادثة ${id.slice(-4)}</div>`
  ).join('');
}
function loadChat(id){ currentChat=id; messages.innerHTML=''; chats[id].forEach(m=>addMessage(m.content,m.role)); toggleSidebar(); }

loadModels(); loadChatList();
chats[currentChat].forEach(m=>addMessage(m.content,m.role));
</script>
</body>
</html>

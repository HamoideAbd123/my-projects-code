<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Ollama Chat</title>
<style>
body{background:#111;color:#eee;font-family:sans-serif;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}
#messages{flex:1;overflow-y:auto;padding:20px}
.msg{padding:12px 16px;margin:8px 0;border-radius:10px;max-width:80%}
.user{background:#8b5cf6;margin-left:auto}
.ai{background:#222;margin-right:auto}
#inputBox{display:flex;padding:15px;background:#1a1a1a;border-top:1px solid #333}
#prompt{flex:1;padding:12px;border:0;border-radius:8px;background:#000;color:#fff;font-size:16px}
button{padding:12px 20px;margin-right:10px;border:0;border-radius:8px;background:#8b5cf6;color:#fff;font-weight:bold;cursor:pointer}
#topbar{padding:10px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;gap:10px}
select{background:#000;color:#fff;border:1px solid #333;padding:8px;border-radius:8px}
</style>
</head>
<body>
<div id="topbar">
<select id="model"></select>
<button onclick="loadModels()">تحديث</button>
</div>

<div id="messages"></div>

<div id="inputBox">
<textarea id="prompt" rows="1" placeholder="اكتب سؤالك هنا..."></textarea>
<button id="sendBtn">ارسال</button>
</div>

<script>
const messages = document.getElementById('messages');
const prompt = document.getElementById('prompt');
const model = document.getElementById('model');

async function loadModels(){
  try{
    const res = await fetch('/api/tags');
    const data = await res.json();
    model.innerHTML = data.models.map(m => `<option>${m.name}</option>`).join('');
  }catch(e){ alert('شغل السيرفر: go run server_v2.go') }
}

async function send(){
  const text = prompt.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  prompt.value = '';
  const aiDiv = addMsg('', 'ai');

  const url = `/ask?q=${encodeURIComponent(text)}&model=${encodeURIComponent(model.value)}`;
  const res = await fetch(url);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = '';
  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    const chunk = decoder.decode(value);
    chunk.split('\n').filter(l=>l).forEach(line=>{
      const data = JSON.parse(line);
      if(data.response){
        full += data.response;
        aiDiv.innerText = full;
        messages.scrollTop = messages.scrollHeight;
      }
    });
  }
}

function addMsg(text, role){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerText = text;
  messages.appendChild(div);
  return div;
}

document.getElementById('sendBtn').onclick = send;
prompt.onkeydown = (e) => { if(e.key==='Enter' &&!e.shiftKey){ e.preventDefault(); send(); } };
loadModels();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - Ollama Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050a;--card:#0f0f16;--card2:#141422;--accent:#a855f7;--accent2:#ec4899;--text:#f8fafc;--dim:#94a3b8}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(15,15,22,.8);backdrop-filter:blur(15px);border-bottom:1px solid #222;flex-shrink:0}
.logo{font-weight:800;font-size:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav a{color:#ccc;text-decoration:none;margin-right:16px;font-weight:600;font-size:14px}
.nav a.active{color:var(--accent)}
.chat{flex:1;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:92%;padding:16px;border-radius:18px;position:relative}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:var(--card2);border:1px solid #222;border-bottom-left-radius:6px}
.actions{position:absolute;left:10px;top:8px;display:flex;gap:6px;opacity:0;transition:.2s}
.msg:hover .actions{opacity:1}
.actions button{background:#0005;border:0;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}
.input{display:flex;gap:10px;padding:14px;background:rgba(15,15,22,.9);border-top:1px solid #222}
.input textarea{flex:1;background:var(--bg);border:1px solid #333;border-radius:16px;padding:14px;color:#fff;resize:none;max-height:150px;outline:none;font-size:16px}
.input select{background:var(--bg);border:1px solid #333;color:#fff;border-radius:12px;padding:0 12px}
.send{width:52px;height:52px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:22px;cursor:pointer}
.code{background:#000;border:1px solid #333;border-radius:10px;padding:12px;font-family:monospace;font-size:13px;margin:8px 0}
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ V4.0</div>
  <div class="nav">
    <a href="index.html">الرئيسية</a>
    <a href="dashboard.html" class="active">لوحة التحكم</a>
    <a href="settings.html">الاعدادات</a>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="input">
<select id="model"></select>
<textarea id="prompt" rows="1" placeholder="اسأل Ollama اي شي..."></textarea>
<button class="send" id="send">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const prompt = document.getElementById('prompt');
const model = document.getElementById('model');
const sendBtn = document.getElementById('send');

async function loadModels(){
  try{
    const res = await fetch('/api/tags');
    const data = await res.json();
    model.innerHTML = data.models.map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
  }catch(e){ add('ai','خطأ: شغل go run server_v23.go') }
}

function add(role, text){
  const div = document.createElement('div'); div.className='msg '+ (role==='user'?'me':'ai');
  let actions = '';
  if(role === 'ai'){
    actions = `<div class="actions"><button onclick="translateMsg(this, 'en', 'ar')">AR</button><button onclick="translateMsg(this, 'ar', 'en')">EN</button><button onclick="copy(this)">نسخ</button></div>`;
  }
  div.innerHTML = actions + format(text);
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight; return div;
}

function format(t){ return t.replace(/```([\s\S]*?)```/g,'<div class="code">$1</div>') }
function copy(btn){ navigator.clipboard.writeText(btn.parentNode.parentNode.innerText.replace(/AR|EN|نسخ/g,'')); btn.innerText='تم'; setTimeout(()=>btn.innerText='نسخ',1000) }

async function translateMsg(btn, from, to){
  const msgDiv = btn.parentNode.parentNode;
  const originalText = msgDiv.innerText.replace(/AR|EN|نسخ/g,'');
  btn.innerText = '...';
  const res = await fetch(`/translate?text=${encodeURIComponent(originalText)}&from=${from}&to=${to}`);
  const data = await res.json();
  msgDiv.innerHTML = format(data.translated) + `<div class="actions"><button onclick="translateMsg(this, '${to}', '${from}')">رجوع</button><button onclick="copy(this)">نسخ</button></div>`;
}

async function send(){
  const q = prompt.value.trim(); if(!q) return;
  sendBtn.disabled = true;
  add('user',q); prompt.value='';
  const ai = add('ai','');
  try{
    const res = await fetch(`/ask?q=${encodeURIComponent(q)}&model=${encodeURIComponent(model.value)}`);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let full='';
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      dec.decode(value).split('\n').filter(l=>l).forEach(line=>{
        const d=JSON.parse(line); if(d.response){
          full+=d.response;
          ai.innerHTML=`<div class="actions"><button onclick="translateMsg(this, 'en', 'ar')">AR</button><button onclick="translateMsg(this, 'ar', 'en')">EN</button><button onclick="copy(this)">نسخ</button></div>` + format(full);
          chat.scrollTop=chat.scrollHeight;
        }
      });
    }
  }catch(e){ ai.innerText = 'خطأ في الاتصال' }
  sendBtn.disabled = false;
}

sendBtn.onclick=send;
prompt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
prompt.oninput=()=>{prompt.style.height='auto';prompt.style.height=prompt.scrollHeight+'px'}
loadModels();
</script>
</body>
</html>

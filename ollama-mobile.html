<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ollama Mobile AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d10;--card:#17171f;--accent:#8b5cf6;--text:#f1f1f3}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh} /* 100dvh عشان الكيبورد في الجوال */
.header{padding:12px 16px;background:var(--card);border-bottom:1px solid #2a2a35;display:flex;align-items:center;gap:10px;flex-shrink:0}
.header select{flex:1;background:#0d0d10;border:1px solid #333;border-radius:10px;color:#fff;padding:10px;font-size:14px}
.header button{background:#333;border:0;border-radius:10px;color:#fff;padding:10px 12px;font-size:14px}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{padding:14px 16px;border-radius:14px;max-width:90%;line-height:1.7;white-space:pre-wrap;font-size:15px}
.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px}
.input-area{padding:12px;background:var(--card);border-top:1px solid #2a2a35;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
#prompt{flex:1;background:#0d0d10;border:1px solid #333;border-radius:14px;color:#fff;padding:12px 14px;font-size:16px;resize:none;max-height:120px;outline:none}
#prompt:focus{border-color:var(--accent)}
#sendBtn{width:50px;height:50px;border-radius:50%;background:var(--accent);border:0;color:#fff;font-size:20px;flex-shrink:0}
.info{font-size:11px;color:#888;margin-top:4px}
.typing::after{content:'...';animation:blink 1.2s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
</style>
</head>
<body>

<div class="header">
<select id="model"></select>
<button onclick="loadModels()">🔄</button>
<button onclick="newChat()">+</button>
</div>

<div id="messages"></div>

<div class="input-area">
<textarea id="prompt" rows="1" placeholder="اكتب رسالتك..."></textarea>
<button id="sendBtn">➤</button>
</div>

<script>
const messages = document.getElementById('messages');
const prompt = document.getElementById('prompt');
const model = document.getElementById('model');
let currentChat = 'chat_'+Date.now();
let chats = {[currentChat]:[]};

async function loadModels(){
 try{
  const res = await fetch('/api/tags');
  const data = await res.json();
  model.innerHTML = data.models.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
 }catch(e){ alert('شغل: go run server_v2.go') }
}

async function send(){
 const text = prompt.value.trim();
 if(!text) return;
 addMessage(text, 'user');
 chats[currentChat].push({role:'user', content:text});
 prompt.value = '';
 prompt.style.height = 'auto';
 const aiDiv = addMessage('', 'ai typing');

 try{
  const url = `/ask?q=${encodeURIComponent(text)}&model=${encodeURIComponent(model.value)}`;
  const res = await fetch(url);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  aiDiv.classList.remove('typing');
  while(true){
   const {value, done} = await reader.read();
   if(done) break;
   const chunk = decoder.decode(value);
   chunk.split('\n').filter(l=>l).forEach(line=>{
    const data = JSON.parse(line);
    if(data.response){
     fullText += data.response;
     aiDiv.innerText = fullText;
     messages.scrollTop = messages.scrollHeight;
    }
   });
  }
  chats[currentChat].push({role:'assistant', content:fullText});
 }catch(e){ aiDiv.innerText = 'خطأ في الاتصال'; aiDiv.classList.remove('typing'); }
}

function addMessage(text, role){
 const div = document.createElement('div');
 div.className = 'msg ' + role;
 div.innerText = text;
 messages.appendChild(div);
 messages.scrollTop = messages.scrollHeight;
 return div;
}

function newChat(){
 currentChat = 'chat_'+Date.now();
 chats[currentChat] = [];
 messages.innerHTML = '';
}

document.getElementById('sendBtn').onclick = send;
prompt.onkeydown = (e) => {
 if(e.key==='Enter' &&!e.shiftKey){ e.preventDefault(); send(); }
};
prompt.oninput = () => { // تكبير الخانة تلقائي
 prompt.style.height = 'auto';
 prompt.style.height = prompt.scrollHeight + 'px';
}

loadModels();
</script>
</body>
</html>

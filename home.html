<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Pro - اختر الواجهة</title>
<style>
:root{--bg:#0d0d0f;--card:#16161c;--accent:#8b5cf6;--text:#e5e5e5}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{text-align:center;max-width:600px;width:100%}
h1{font-size:32px;margin-bottom:10px}
p{color:#aaa;margin-bottom:40px}
.btn-group{display:flex;flex-direction:column;gap:15px}
.btn{
	display:block;
	padding:18px 20px;
	background:var(--card);
	border:2px solid #2a2a35;
	border-radius:12px;
	color:var(--text);
	text-decoration:none;
	font-size:18px;
	font-weight:bold;
	transition:0.3s;
}
.btn:hover{
	background:var(--accent);
	border-color:var(--accent);
	transform:translateY(-3px);
}
.btn span{display:block;font-size:14px;color:#aaa;margin-top:5px;font-weight:normal}
.btn:hover span{color:white}
</style>
</head>
<body>

<div class="container">
	<h1>🚀 Ollama Pro</h1>
	<p>اختر الواجهة اللي عايز تشتغل عليها</p>
	
	<div class="btn-group">
	<a href="/ollama-pro.html" class="btn">
			ollama-pro v1.0
			<span>الواجهة الكلاسيكية</span>
		</a>
		
		<a href="/ollama-proV23.html" class="btn">
			ollama-proV2.3
			<span>واجهة الكتابة التدريجية</span>
		</a>

		<a href="/ollama-proV24.html" class="btn">
			ollama-proV2.4
			<span>احدث اصدار</span>
	</a>
	</div>
</div>

</body>
</html>

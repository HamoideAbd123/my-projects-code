<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Pro V21</title>
<style>
:root{--bg:#0d0d0f;--card:#16161c;--accent:#8b5cf6;--text:#e5e5e5}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
.header{padding:15px 20px;border-bottom:1px solid #2a2a35;display:flex;justify-content:space-between;align-items:center;background:var(--card)}
.header h2{margin:0;font-size:20px;color:var(--accent)}
.top-bar{display:flex;gap:10px;align-items:center}
.top-bar select{padding:10px 12px;background:#0d0d0f;border:1px solid #333;border-radius:8px;color:var(--text);font-size:14px}
#messages{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:15px}
.msg{padding:16px 20px;border-radius:15px;max-width:85%;line-height:1.7;animation:fadeIn 0.3s;white-space:pre-wrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:5px}
.ai{background:#222230;align-self:flex-start;border-bottom-left-radius:5px}
.input{display:flex;padding:20px;gap:10px;background:var(--card);border-top:1px solid #2a2a35}
#prompt{flex:1;padding:14px;background:#0d0d0f;border:1px solid #333;border-radius:10px;color:var(--text);font-size:16px;outline:none}
#prompt:focus{border-color:var(--accent)}
button{padding:12px 20px;background:var(--accent);border:0;border-radius:10px;color:white;font-weight:bold;cursor:pointer;transition:0.2s}
button:hover{opacity:0.8;transform:scale(1.05)}
button:disabled{opacity:0.5;cursor:not-allowed;transform:scale(1)}
</style>
</head>
<body>

<div class="header">
	<h2>🤖 Ollama Pro V21</h2>
	<div class="top-bar">
		<label>الموديل:</label>
		<select id="modelSelect">
			<option value="ar">عربي</option>
			<option value="coder">برمجة</option>
			<option value="en">English</option>
		</select>
	</div>
</div>

<div id="messages">
	<div class="msg ai">مرحبا 👋 انا Ollama Pro V21
اختر الموديل من فوق وابدأ الدردشة</div>
</div>

<div class="input">
	<input id="prompt" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMsg()">
	<button id="sendBtn" onclick="sendMsg()">ارسال</button>
</div>

<script>
const messagesDiv = document.getElementById('messages');
const promptInput = document.getElementById('prompt');
const sendBtn = document.getElementById('sendBtn');
const modelSelect = document.getElementById('modelSelect');

async function sendMsg(){
	let q = promptInput.value.trim();
	if(!q) return;
	
	let model = modelSelect.value;
	
	messagesDiv.innerHTML += `<div class="msg user">${q}</div>`;
	promptInput.value = '';
	messagesDiv.scrollTop = messagesDiv.scrollHeight;
	
	sendBtn.disabled = true;
	messagesDiv.innerHTML += `<div class="msg ai" id="loading">...بفكر</div>`;
	
	try{
		let res = await fetch(`/api/chat?q=${encodeURIComponent(q)}&model=${model}`);
		let data = await res.json();
		document.getElementById('loading').remove();
		messagesDiv.innerHTML += `<div class="msg ai">${data.response}</div>`;
	}catch(e){
		document.getElementById('loading').remove();
		messagesDiv.innerHTML += `<div class="msg ai">خطا في الاتصال بـ Ollama</div>`;
	}
	
	sendBtn.disabled = false;
	messagesDiv.scrollTop = messagesDiv.scrollHeight;
	promptInput.focus();
}
</script>

</body>
</html>

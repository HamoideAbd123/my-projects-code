<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ollama Pro V1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070a;--card:#111118;--card-2:#1a1a24;--accent:#8b5cf6;--accent-2:#ec4899;--text:#f5f5f7;--text-dim:#8a8a9e
}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
.header{padding:12px 16px;background:linear-gradient(135deg,var(--card),var(--card-2));border-bottom:1px solid #2a2a35;display:flex;align-items:center;gap:10px;flex-shrink:0;backdrop-filter:blur(10px)}
.logo{font-weight:700;font-size:16px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header select{flex:1;background:#07070a;border:1px solid #333;border-radius:12px;color:#fff;padding:10px 12px;font-size:14px;outline:none}
.header button{background:var(--card-2);border:1px solid #333;border-radius:12px;color:#fff;padding:10px 12px;font-size:16px;cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.msg{padding:15px 17px;border-radius:16px;max-width:88%;line-height:1.8;white-space:pre-wrap;font-size:15px;animation:slideUp 0.3s}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}}
.user{background:linear-gradient(135deg,var(--accent),var(--accent-2));align-self:flex-end;border-bottom-right-radius:5px}
.ai{background:var(--card-2);align-self:flex-start;border-bottom-left-radius:5px;border:1px solid #2a2a35}
.input-area{padding:14px;background:var(--card);border-top:1px solid #2a2a35;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
#prompt{flex:1;background:#07070a;border:1px solid #333;border-radius:16px;color:#fff;padding:13px 15px;font-size:16px;resize:none;max-height:140px;outline:none;transition:0.2s}
#prompt:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(139,92,246,0.2)}
#sendBtn{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:0;color:#fff;font-size:22px;flex-shrink:0;cursor:pointer;transition:0.2s}
#sendBtn:active{transform:scale(0.92)}
.info{font-size:11px;color:var(--text-dim);margin-top:6px;display:flex;gap:10px}
.typing::after{content:'▋';animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.code-block{background:#000;border:1px solid #333;border-radius:10px;padding:10px;margin:8px 0;font-family:monospace;font-size:13px;overflow-x:auto}
</style>
</head>
<body>

<div class="header">
<div class="logo">⚡ Ollama Pro V1.1</div>
<select id="model"></select>
<button onclick="loadModels()" title="تحديث الموديلات">🔄</button>
<button onclick="clearChat()" title="مسح المحادثة">🗑️</button>
</div>

<div id="messages"></div>

<div class="input-area">
<textarea id="prompt" rows="1" placeholder="اسأل اي شي... Shift+Enter لسطر جديد"></textarea>
<button id="sendBtn">➤</button>
</div>

<script>
const messages = document.getElementById('messages');
const prompt = document.getElementById('prompt');
const model = document.getElementById('model');
let currentChat = 'chat_'+Date.now();
let chats = {[currentChat]:[]};

async function loadModels(){
 try{
  const res = await fetch('/api/tags');
  const data = await res.json();
  model.innerHTML = data.models.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
 }catch(e){ addMessage('خطأ: شغل السيرفر go run server_v2.go', 'ai') }
}

async function send(){
 const text = prompt.value.trim();
 if(!text) return;
 addMessage(text, 'user');
 chats[currentChat].push({role:'user', content:text});
 prompt.value = '';
 prompt.style.height = 'auto';
 const aiDiv = addMessage('', 'ai typing');
 const start = Date.now();

 try{
  const url = `/ask?q=${encodeURIComponent(text)}&model=${encodeURIComponent(model.value)}`;
  const res = await fetch(url);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  aiDiv.classList.remove('typing');
  while(true){
   const {value, done} = await reader.read();
   if(done) break;
   const chunk = decoder.decode(value);
   chunk.split('\n').filter(l=>l).forEach(line=>{
    const data = JSON.parse(line);
    if(data.response){
     fullText += data.response;
     aiDiv.innerHTML = formatText(fullText);
     messages.scrollTop = messages.scrollHeight;
    }
   });
  }
  const time = ((Date.now()-start)/1000).toFixed(1);
  aiDiv.innerHTML += `<div class="info">⏱️ ${time}ث <button onclick="copyText(this)" style="background:none;border:0;color:var(--accent);cursor:pointer">نسخ</button></div>`;
  chats[currentChat].push({role:'assistant', content:fullText});
 }catch(e){ aiDiv.innerText = 'خطأ في الاتصال'; aiDiv.classList.remove('typing'); }
}

function addMessage(text, role){
 const div = document.createElement('div');
 div.className = 'msg ' + role;
 div.innerHTML = formatText(text);
 messages.appendChild(div);
 messages.scrollTop = messages.scrollHeight;
 return div;
}

// ينسق الكود والروابط
function formatText(text){
  return text
   .replace(/```(.*?)```/gs, '<div class="code-block">$1</div>')
   .replace(/`(.*?)`/g, '<code style="background:#000;padding:2px 6px;border-radius:5px">$1</code>')
}

function copyText(btn){
  const text = btn.parentElement.parentElement.innerText.replace(/⏱️.*نسخ/, '');
  navigator.clipboard.writeText(text);
  btn.innerText = 'تم!';
  setTimeout(()=>btn.innerText='نسخ', 1500);
}

function clearChat(){
 messages.innerHTML = '';
 chats[currentChat] = [];
}

document.getElementById('sendBtn').onclick = send;
prompt.onkeydown = (e) => {
 if(e.key==='Enter' &&!e.shiftKey){ e.preventDefault(); send(); }
};
prompt.oninput = () => {
 prompt.style.height = 'auto';
 prompt.style.height = prompt.scrollHeight + 'px';
}

loadModels();
</script>
</body>
</html>

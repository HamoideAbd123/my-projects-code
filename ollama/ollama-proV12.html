<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Pro AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--card:#14141a;--card-2:#1c1c24;--accent:#8b5cf6;--accent-hover:#7c3aed;--text:#e8e8ea;--text-dim:#888}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;background:var(--card);border-left:1px solid #2a2a35;display:flex;flex-direction:column;transition:0.3s}
.sidebar.hidden{margin-right:-280px}
.logo{padding:20px;font-size:20px;font-weight:700;color:var(--accent)}
.settings{padding:15px;border-bottom:1px solid #2a2a35}
.chat-list{flex:1;overflow-y:auto;padding:10px}
.chat-item{padding:12px;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:14px}
.chat-item:hover{background:var(--card-2)}
.chat-item.active{background:var(--accent)}
.chat{flex:1;display:flex;flex-direction:column}
.header{padding:15px 20px;border-bottom:1px solid #2a2a35;display:flex;align-items:center;gap:15px;background:var(--card)}
.menu-btn{font-size:24px;background:none;border:0;color:var(--text);cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:18px}
.msg{padding:16px 20px;border-radius:15px;max-width:75%;line-height:1.8;white-space:pre-wrap;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:5px}
.ai{background:var(--card-2);align-self:flex-start;border-bottom-left-radius:5px}
.input{display:flex;padding:20px;gap:10px;background:var(--card);border-top:1px solid #2a2a35}
#prompt{flex:1;padding:14px;background:var(--bg);border:1px solid #333;border-radius:12px;color:#fff;resize:none;font-size:15px;outline:none}
#prompt:focus{border-color:var(--accent)}
button{padding:12px 18px;background:var(--accent);border:0;border-radius:12px;color:#fff;font-weight:600;cursor:pointer;transition:0.2s}
button:hover{background:var(--accent-hover)}
input,select{width:100%;padding:11px;margin:6px 0;background:var(--bg);border:1px solid #333;border-radius:10px;color:#fff;outline:none}
label{font-size:13px;color:var(--text-dim)}
.info{font-size:12px;color:var(--text-dim);margin-top:5px}
.typing::after{content:'▋';animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<div class="logo">⚡ Ollama Pro</div>
<div class="settings">
<label>الموديل</label>
<select id="model"></select>
<button onclick="loadModels()" style="width:100%;margin-top:5px;background:#333">🔄 تحديث</button>
<p id="status" style="font-size:12px;color:#4ade80;text-align:center"></p>
<label>Temperature: <span id="t_val">0.7</span></label>
<input id="temp" type="range" min="0" max="1.5" step="0.1" value="0.7">
</div>
<div class="chat-list">
<button onclick="newChat()" style="width:100%;margin-bottom:10px">+ محادثة جديدة</button>
<div id="chat_list"></div>
</div>
</div>

<div class="chat">
<div class="header">
<button class="menu-btn" onclick="toggleSidebar()">☰</button>
<h2 style="margin:0;font-size:18px">المساعد الذكي</h2>
<button onclick="clearChat()" style="margin-right:auto;background:#333">🗑️ مسح</button>
</div>
<div id="messages"></div>
<div class="input">
<textarea id="prompt" rows="1" placeholder="اسأل اي شي... Shift+Enter لسطر جديد"></textarea>
<button id="sendBtn">ارسال</button>
</div>
</div>

<script>
const messages = document.getElementById('messages');
const prompt = document.getElementById('prompt');
const model = document.getElementById('model');
const temp = document.getElementById('temp');
const t_val = document.getElementById('t_val');

let chats = JSON.parse(localStorage.getItem('ollama_chats')||'{}');
let currentChat = Object.keys(chats)[0] || 'chat_'+Date.now();
if(!chats[currentChat]) chats[currentChat]=[];

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('hidden'); }
temp.oninput = () => t_val.innerText = temp.value;
document.getElementById('sendBtn').onclick = send;
prompt.onkeydown = (e) => { if(e.key==='Enter' &&!e.shiftKey){ e.preventDefault(); send(); } };

async function loadModels(){
 status.innerText = 'جاري الاتصال...';
 try{
  const res = await fetch('/api/tags');
  const data = await res.json();
  model.innerHTML = data.models.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
  status.innerText = 'متصل ✅';
 }catch(e){ status.innerText = 'خطأ: شغل السيرفر'; }
}

async function send(){
 const text = prompt.value.trim();
 if(!text) return;
 addMessage(text, 'user');
 chats[currentChat].push({role:'user', content:text});
 prompt.value = '';
 const aiDiv = addMessage('', 'ai typing');
 const start = Date.now();

 try{
  const url = `/ask?q=${encodeURIComponent(text)}&model=${encodeURIComponent(model.value)}`;
  const res = await fetch(url);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  aiDiv.classList.remove('typing');
  while(true){
   const {value, done} = await reader.read();
   if(done) break;
   const chunk = decoder.decode(value);
   chunk.split('\n').filter(l=>l).forEach(line=>{
    const data = JSON.parse(line);
    if(data.response){
     fullText += data.response;
     aiDiv.innerText = fullText;
     messages.scrollTop = messages.scrollHeight;
    }
   });
  }
  const time = ((Date.now()-start)/1000).toFixed(1);
  aiDiv.innerHTML += `<div class="info">⏱️ ${time} ثانية</div>`;
  chats[currentChat].push({role:'assistant', content:fullText});
  saveChats();
 }catch(e){ aiDiv.innerText = 'خطأ: ' + e.message; aiDiv.classList.remove('typing'); }
}

function addMessage(text, role){
 const div = document.createElement('div');
 div.className = 'msg ' + role;
 div.innerText = text;
 messages.appendChild(div);
 messages.scrollTop = messages.scrollHeight;
 return div;
}
function saveChats(){ localStorage.setItem('ollama_chats', JSON.stringify(chats)); loadChatList(); }
function newChat(){ currentChat='chat_'+Date.now(); chats[currentChat]=[]; saveChats(); messages.innerHTML=''; }
function clearChat(){ chats[currentChat]=[]; saveChats(); messages.innerHTML=''; }
function loadChatList(){
 chat_list.innerHTML = Object.keys(chats).slice(-20).reverse().map(id=>
  `<div class="chat-item ${id===currentChat?'active':''}" onclick="loadChat('${id}')">محادثة ${id.slice(-4)}</div>`
 ).join('');
}
function loadChat(id){
 currentChat=id; messages.innerHTML='';
 chats[id].forEach(m=>addMessage(m.content,m.role));
 saveChats();
 if(window.innerWidth < 768) toggleSidebar();
}

loadModels(); loadChatList(); chats[currentChat].forEach(m=>addMessage(m.content,m.role));
</script>
</body>
</html>

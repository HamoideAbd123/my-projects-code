<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Pro V21</title>
<style>
:root{--bg:#0d0d0f;--card:#16161c;--accent:#8b5cf6;--text:#e5e5e5}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
.header{padding:15px 20px;border-bottom:1px solid #2a2a35;display:flex;justify-content:space-between;align-items:center;background:var(--card)}
.header h2{margin:0;font-size:20px;color:var(--accent)}
.controls{display:flex;gap:10px;align-items:center}
.controls select{padding:10px 12px;background:#0d0d0f;border:1px solid #333;border-radius:8px;color:var(--text)}
#messages{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:18px}
.msg{padding:16px 20px;border-radius:15px;max-width:85%;line-height:1.8;white-space:pre-wrap;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:5px}
.ai{background:#222230;align-self:flex-start;border-bottom-left-radius:5px}
.input{display:flex;padding:20px;gap:10px;background:var(--card);border-top:1px solid #2a2a35}
#prompt{flex:1;padding:14px;background:#0d0d0f;border:1px solid #333;border-radius:12px;color:#fff;resize:none;font-size:15px}
button{padding:12px 20px;background:var(--accent);border:0;border-radius:12px;color:#fff;font-weight:bold;cursor:pointer}
button:hover{opacity:0.8} button:disabled{opacity:0.5}
</style>
</head>
<body>

<div class="header">
	<h2>🤖 Ollama Pro V21</h2>
	<div class="controls">
	<label>الموديل:</label>
		<select id="model"></select>
	</div>
</div>

<div id="messages"><div class="msg ai">مرحبا 👋 اختار الموديل وابدأ</div></div>

<div class="input">
	<textarea id="prompt" rows="2" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
	<button id="sendBtn" onclick="send()">ارسال</button>
</div>

<script>
const messages = document.getElementById('messages');
const prompt = document.getElementById('prompt');
const modelSelect = document.getElementById('model');
const sendBtn = document.getElementById('sendBtn');
const OLLAMA_URL = "http://127.0.0.1:11434"; // مباشر على Ollama

// نجيب الموديلات اول ما الصفحة تفتح
async function loadModels(){
	try{
		const res = await fetch(OLLAMA_URL+'/api/tags');
		const data = await res.json();
		modelSelect.innerHTML = data.models.map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
	}catch(e){
		messages.innerHTML += `<div class="msg ai">خطا: ما قدرت اتصل بـ Ollama. اتاكد انو شغال على 11434</div>`;
	}
}

async function send(){
	const text = prompt.value.trim();
	if(!text) return;
	
	addMessage(text,'user');
	prompt.value = '';
	sendBtn.disabled = true;
	const aiDiv = addMessage('','ai');
	
	try{
		const res = await fetch(OLLAMA_URL+'/api/generate',{
			method:'POST',
			headers:{'Content-Type':'application/json'},
			body:JSON.stringify({
				model:modelSelect.value,
				prompt:text,
				stream:false // سريع بدون كتابة تدريجية
			})
		});
		const data = await res.json();
		aiDiv.innerText = data.response;
	}catch(e){
	aiDiv.innerText = 'خطا: ' + e.message;
	}
	sendBtn.disabled = false;
	messages.scrollTop = messages.scrollHeight;
}

function addMessage(text,role){
	const div = document.createElement('div');
	div.className = 'msg ' + role;
	div.innerText = text;
	messages.appendChild(div);
	messages.scrollTop = messages.scrollHeight;
	return div;
}

loadModels(); // شغل اول ما يفتح
</script>
</body>
</html>

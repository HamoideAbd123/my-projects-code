<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Pro AI</title>
<style>
:root{--bg:#0d0d0f;--card:#16161c;--accent:#8b5cf6;--text:#e5e5e5}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
.sidebar{width:300px;background:var(--card);padding:20px;border-left:1px solid #2a2a35;transition:0.3s}
.sidebar.hidden{transform:translateX(100%)}
.sidebar h3{margin-top:0}
.sidebar label{display:block;margin:10px 0 5px;font-size:14px}
.sidebar select{width:100%;padding:10px;background:#0d0d0f;border:1px solid #333;border-radius:8px;color:var(--text)}
.chat{flex:1;display:flex;flex-direction:column;width:100%}
.header{padding:15px 20px;border-bottom:1px solid #2a2a35;display:flex;justify-content:space-between;align-items:center}
.menu-btn{font-size:24px;background:none;border:0;color:var(--text);cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:15px}
.msg{padding:16px 20px;border-radius:15px;max-width:85%;line-height:1.7;animation:fadeIn 0.3s;white-space:pre-wrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:5px}
.ai{background:#222230;align-self:flex-start;border-bottom-left-radius:5px}
.input{display:flex;padding:20px;gap:10px;background:var(--card);border-top:1px solid #2a2a35}
#prompt{flex:1;padding:14px;background:#0d0d0f;border:1px solid #333;border-radius:10px;color:var(--text);font-size:16px}
button{padding:12px 18px;background:var(--accent);border:0;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:0.8} button:disabled{opacity:0.5;cursor:not-allowed}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
	<h3>الاعدادات</h3>
	<label>اختر الموديل</label>
	<select id="modelSelect">
		<option value="ar">العربي - tinydolphin-ar-v1</option>
	<option value="coder">البرمجة - dolphin-coder-v1</option>
		<option value="en">الانجليزي - tinydolphin</option>
	</select>
</div>

<div class="chat">
	<div class="header">
	<button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('hidden')">☰</button>
	<h2>Ollama Pro AI</h2>
	</div>
	<div id="messages"><div class="msg ai">مرحبا 👋</div></div>
	<div class="input">
		<input id="prompt" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendMsg()">
		<button id="sendBtn" onclick="sendMsg()">ارسال</button>
	</div>
</div>

<script>
const messagesDiv = document.getElementById('messages');
const promptInput = document.getElementById('prompt');
const sendBtn = document.getElementById('sendBtn');
const modelSelect = document.getElementById('modelSelect');

async function sendMsg(){
	let q = promptInput.value.trim();
	if(!q) return;
	let model = modelSelect.value;
	messagesDiv.innerHTML += `<div class="msg user">${q}</div>`;
	promptInput.value = '';
	messagesDiv.scrollTop = messagesDiv.scrollHeight;
	sendBtn.disabled = true;
	messagesDiv.innerHTML += `<div class="msg ai" id="loading">...بفكر</div>`;
	try{
		let res = await fetch(`/api/chat?q=${encodeURIComponent(q)}&model=${model}`);
		let data = await res.json();
		document.getElementById('loading').remove();
		messagesDiv.innerHTML += `<div class="msg ai">${data.response}</div>`;
	}catch(e){
		document.getElementById('loading').remove();
		messagesDiv.innerHTML += `<div class="msg ai">خطا في الاتصال</div>`;
	}
	sendBtn.disabled = false;
	messagesDiv.scrollTop = messagesDiv.scrollHeight;
}
</script>
</body>
</html>

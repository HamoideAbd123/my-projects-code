<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ollama Pro V2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05050a;--card:#0f0f16;--card-2:#181825;--accent:#8b5cf6;--accent-2:#d946ef;--text:#fafafa;--text-dim:#9ca3af
}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
.header{padding:12px 14px;background:rgba(15,15,22,0.8);border-bottom:1px solid #2a2a35;display:flex;align-items:center;gap:8px;flex-shrink:0;backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.logo{font-weight:700;font-size:15px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header select{flex:1;background:#05050a;border:1px solid #333;border-radius:12px;color:#fff;padding:10px;font-size:14px}
.icon-btn{background:var(--card-2);border:1px solid #333;border-radius:12px;color:#fff;padding:10px;width:42px;height:42px;font-size:18px;cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.msg{padding:14px 16px;border-radius:16px;max-width:90%;line-height:1.8;white-space:pre-wrap;font-size:15px;animation:fadeIn 0.25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
.user{background:linear-gradient(135deg,var(--accent),var(--accent-2));align-self:flex-end;border-bottom-right-radius:6px}
.ai{background:var(--card-2);align-self:flex-start;border-bottom-left-radius:6px;border:1px solid #2a2a35}
.input-area{padding:12px;background:rgba(15,15,22,0.9);border-top:1px solid #2a2a35;display:flex;gap:10px;align-items:flex-end;flex-shrink:0;backdrop-filter:blur(12px)}
#prompt{flex:1;background:#05050a;border:1px solid #333;border-radius:18px;color:#fff;padding:14px 16px;font-size:16px;resize:none;max-height:160px;outline:none}
#prompt:focus{border-color:var(--accent)}
#sendBtn{width:50px;height:50px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:0;color:#fff;font-size:22px;cursor:pointer;flex-shrink:0}
#sendBtn:disabled{opacity:0.5}
.info{font-size:11px;color:var(--text-dim);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.info button{background:none;border:0;color:var(--accent);cursor:pointer;font-size:11px}
.code-block{background:#000;border:1px solid #333;border-radius:10px;padding:12px;margin:8px 0;font-family:monospace;font-size:13px;overflow-x:auto;position:relative}
.copy-code{position:absolute;left:8px;top:8px;background:var(--card-2);border:0;color:#fff;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer}
.typing::after{content:'▋';animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>

<div class="header">
<div class="logo">⚡ V2.0</div>
<select id="model"></select>
<button class="icon-btn" onclick="loadModels()" title="تحديث">🔄</button>
<button class="icon-btn" onclick="exportChat()" title="تصدير">📥</button>
<button class="icon-btn" onclick="clearChat()" title="مسح">🗑️</button>
</div>

<div id="messages"></div>

<div class="input-area">
<textarea id="prompt" rows="1" placeholder="اسأل اي شي..."></textarea>
<button id="sendBtn">➤</button>
</div>

<script>
const messages = document.getElementById('messages');
const prompt = document.getElementById('prompt');
const model = document.getElementById('model');
const sendBtn = document.getElementById('sendBtn');
let currentChat = localStorage.getItem('currentChat') || 'chat_'+Date.now();
let chats = JSON.parse(localStorage.getItem('ollama_chats_v2')||'{}');
if(!chats[currentChat]) chats[currentChat]=[];

async function loadModels(){
 try{
  const res = await fetch('/api/tags');
  const data = await res.json();
  model.innerHTML = data.models.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
 }catch(e){ addMessage('خطأ: شغل go run server_v2.go', 'ai') }
}

async function send(){
 const text = prompt.value.trim();
 if(!text) return;
 sendBtn.disabled = true;
 addMessage(text, 'user');
 chats[currentChat].push({role:'user', content:text});
 prompt.value = '';
 prompt.style.height = 'auto';
 const aiDiv = addMessage('', 'ai typing');
 const start = Date.now();

 try{
  const url = `/ask?q=${encodeURIComponent(text)}&model=${encodeURIComponent(model.value)}`;
  const res = await fetch(url);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  aiDiv.classList.remove('typing');
  while(true){
   const {value, done} = await reader.read();
   if(done) break;
   const chunk = decoder.decode(value);
   chunk.split('\n').filter(l=>l).forEach(line=>{
    const data = JSON.parse(line);
    if(data.response){
     fullText += data.response;
     aiDiv.innerHTML = formatText(fullText);
     messages.scrollTop = messages.scrollHeight;
    }
   });
  }
  const time = ((Date.now()-start)/1000).toFixed(1);
  aiDiv.innerHTML += `<div class="info">⏱️ ${time}ث <button onclick="copyText(this)">نسخ</button></div>`;
  chats[currentChat].push({role:'assistant', content:fullText});
  saveChats();
 }catch(e){ aiDiv.innerText = 'خطأ في الاتصال'; aiDiv.classList.remove('typing'); }
 finally{ sendBtn.disabled = false; }
}

function addMessage(text, role){
 const div = document.createElement('div');
 div.className = 'msg ' + role;
 div.innerHTML = formatText(text);
 messages.appendChild(div);
 messages.scrollTop = messages.scrollHeight;
 return div;
}

function formatText(text){
  return text
  .replace(/```(\w+)?\n([\s\S]*?)```/g, (m, lang, code) =>
     `<div class="code-block"><button class="copy-code" onclick="copyCode(this)">نسخ</button>${escapeHtml(code)}</div>`)
  .replace(/`(.*?)`/g, '<code style="background:#000;padding:2px 6px;border-radius:5px">$1</code>')
}

function escapeHtml(text){ return text.replace(/</g,"&lt;").replace(/>/g,"&gt;") }

function copyText(btn){
  const text = btn.parentElement.parentElement.innerText.replace(/⏱️.*نسخ/, '');
  navigator.clipboard.writeText(text);
  btn.innerText = 'تم!';
  setTimeout(()=>btn.innerText='نسخ', 1200);
}

function copyCode(btn){
  const code = btn.nextSibling.textContent;
  navigator.clipboard.writeText(code);
  btn.innerText = 'تم!';
  setTimeout(()=>btn.innerText='نسخ', 1200);
}

function saveChats(){
  localStorage.setItem('ollama_chats_v2', JSON.stringify(chats));
  localStorage.setItem('currentChat', currentChat);
}

function clearChat(){
  if(confirm('متأكد عايز تمسح المحادثة؟')){
    chats[currentChat] = [];
    messages.innerHTML = '';
    saveChats();
  }
}

function exportChat(){
  const txt = chats[currentChat].map(m => `${m.role}:\n${m.content}\n\n`).join('');
  const blob = new Blob([txt], {type: 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `chat-${currentChat.slice(-4)}.txt`; a.click();
}

document.getElementById('sendBtn').onclick = send;
prompt.onkeydown = (e) => {
 if(e.key==='Enter' &&!e.shiftKey){ e.preventDefault(); send(); }
};
prompt.oninput = () => {
 prompt.style.height = 'auto';
 prompt.style.height = prompt.scrollHeight + 'px';
}

// تحميل المحادثة القديمة
chats[currentChat].forEach(m=>addMessage(m.content,m.role));
loadModels();
</script>
</body>
</html>
